apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: crypto-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; echo "PostgreSQL is ready!"']
      containers:
      - name: collector
        image: crypto-collector:latest
        imagePullPolicy: Never
        env:
        - name: NODE_ENV
          value: production
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: crypto_platform
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: COLLECTION_INTERVAL
          value: "300000"
        - name: METRICS_PORT
          value: "9091"
        ports:
        - containerPort: 9091
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9091
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9091
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: crypto-platform
spec:
  selector:
    app: collector
  ports:
  - port: 9091
    targetPort: 9091
  type: ClusterIP
