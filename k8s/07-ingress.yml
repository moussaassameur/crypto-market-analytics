apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crypto-platform-ingress
  namespace: crypto-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  # Frontend principal
  - host: crypto-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  
  # WWW redirect
  - host: www.crypto-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  
  # API Backend
  - host: api.crypto-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000
  
  # Grafana Dashboard
  - host: grafana.crypto-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
  
  # Prometheus (optionnel - à sécuriser en production)
  - host: prometheus.crypto-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
