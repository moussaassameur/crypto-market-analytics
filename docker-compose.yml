services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16
    container_name: crypto-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_platform
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  # API Backend
  api:
    build: ./api
    container_name: crypto-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crypto_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your_jwt_secret_here
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto-network

  # Frontend React/Vite
  frontend:
    build: ./cryptoFront
    container_name: crypto-frontend
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - crypto-network

  # Collector - collecte des données de marché
  collector:
    build: ./collector
    container_name: crypto-collector
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: crypto_platform
      PGUSER: postgres
      PGPASSWORD: postgres
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto-network

  # RabbitMQ (optionnel)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: crypto-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - crypto-network

  # Service de backup automatique
  backup:
    build: ./scripts
    container_name: crypto-backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: crypto_platform
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./backups:/backups
      - .:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto-network

networks:
  crypto-network:
    driver: bridge
