# Informations du projet
sonar.projectKey=moussaassameur_crypto-market-analytics
sonar.projectName=Crypto Trading Platform
sonar.projectVersion=1.0
sonar.organization=moussaassameur

# Fichiers sources
sonar.sources=api/src,cryptoFront/src,collector/src
sonar.tests=api/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/logs/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Couverture de code (utilise les rapports Jest)
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info
sonar.typescript.lcov.reportPaths=api/coverage/lcov.info
sonar.coverage.exclusions=**/__tests__/**,**/tests/**,**/*.test.js,**/*.spec.js

# Encodage
sonar.sourceEncoding=UTF-8