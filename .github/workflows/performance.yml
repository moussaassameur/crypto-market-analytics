name: Performance Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:      # Manual trigger
  push:
    paths:
      - 'api/tests/k6/**'

jobs:
  performance:
    name: K6 Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: crypto_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'api/package-lock.json'

    - name: Install Dependencies
      working-directory: ./api
      run: npm ci

    - name: Start API Server
      working-directory: ./api
      run: |
        npm start &
        sleep 10
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword
        JWT_SECRET: test-secret-key
        RABBITMQ_URL: amqp://guest:guest@localhost:5672

    - name: Install K6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Wait for API Ready
      run: |
        echo "Waiting for API to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health; then
            echo "API is ready"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done

    - name: Run Smoke Test
      working-directory: ./api
      run: k6 run tests/k6/smoke-test.js
      env:
        API_URL: http://localhost:3000

    - name: Run Load Test
      working-directory: ./api
      run: k6 run tests/k6/load-test.js
      env:
        API_URL: http://localhost:3000

    - name: Run Stress Test
      working-directory: ./api
      run: k6 run tests/k6/stress-test.js
      env:
        API_URL: http://localhost:3000
      continue-on-error: true

    - name: Generate Performance Report
      working-directory: ./api
      run: |
        mkdir -p reports/performance
        echo "Performance Test Report - $(date)" > reports/performance/summary.txt
        echo "Smoke Test: PASSED" >> reports/performance/summary.txt
        echo "Load Test: PASSED" >> reports/performance/summary.txt
        echo "Stress Test: COMPLETED" >> reports/performance/summary.txt

    - name: Upload Performance Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: api/reports/performance/

    - name: Performance Alert
      if: failure()
      run: |
        echo "Performance tests failed"
        echo "Check the artifacts for detailed results"