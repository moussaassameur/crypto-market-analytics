name: CI/CD Pipeline - Tests, Sécurité et Déploiement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # Manual trigger

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: crypto_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'api/package-lock.json'

    - name: Install Dependencies
      working-directory: ./api
      run: npm ci

    - name: Setup Database
      working-directory: ./api
      run: |
        sleep 5
        PGPASSWORD=testpassword psql -h localhost -p 5433 -U postgres -d crypto_test -f scripts/init-database.sql
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword

    - name: Run Integration Tests with Coverage
      working-directory: ./api
      run: npm run ci:test
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword
        JWT_SECRET: test-secret-key
        RABBITMQ_URL: amqp://guest:guest@localhost:5672

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: api/coverage/

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: backend-tests
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install API Dependencies
      working-directory: ./api
      run: npm ci

    - name: Install Frontend Dependencies
      working-directory: ./cryptoFront
      run: npm ci

    - name: Install Collector Dependencies
      working-directory: ./collector
      run: npm ci

    - name: Run API Tests with Coverage
      working-directory: ./api
      run: npm run test:coverage
      env:
        NODE_ENV: test

    - name: Run Frontend Tests with Coverage
      working-directory: ./cryptoFront
      run: npm run test:coverage

    - name: Run Collector Tests with Coverage
      working-directory: ./collector
      run: npm run test:coverage

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install API Dependencies
      working-directory: ./api
      run: npm ci

    - name: Install Frontend Dependencies
      working-directory: ./cryptoFront
      run: npm ci

    - name: Install Collector Dependencies
      working-directory: ./collector
      run: npm ci

    - name: NPM Audit - API
      working-directory: ./api
      run: npm audit --audit-level=high || true
      continue-on-error: true

    - name: NPM Audit - Frontend
      working-directory: ./cryptoFront
      run: npm audit --audit-level=high || true
      continue-on-error: true

    - name: NPM Audit - Collector
      working-directory: ./collector
      run: npm audit --audit-level=high || true
      continue-on-error: true

    - name: Snyk - Scan All Projects
      run: |
        npm install -g snyk
        snyk test --all-projects --severity-threshold=high || true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

    - name: Snyk Code - Static Analysis (SAST)
      run: snyk code test --severity-threshold=high || true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

    - name: Security Summary
      run: |
        echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "NPM Audit, Snyk Dependency Scan, and SAST completed" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'cryptoFront/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./cryptoFront
      run: npm ci

    - name: Build Frontend
      working-directory: ./cryptoFront
      run: npm run build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: cryptoFront/dist/

  collector-test:
    name: Collector Service Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'collector/package-lock.json'

    - name: Install Collector Dependencies
      working-directory: ./collector
      run: npm ci

    - name: Test Collector Service
      working-directory: ./collector
      run: node -c src/index.js

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, collector-test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push API Image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        tags: |
          ghcr.io/${{ github.actor }}/crypto-api:latest
          ghcr.io/${{ github.actor }}/crypto-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./cryptoFront
        push: true
        tags: |
          ghcr.io/${{ github.actor }}/crypto-frontend:latest
          ghcr.io/${{ github.actor }}/crypto-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Collector Image
      uses: docker/build-push-action@v5
      with:
        context: ./collector
        push: true
        tags: |
          ghcr.io/${{ github.actor }}/crypto-collector:latest
          ghcr.io/${{ github.actor }}/crypto-collector:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-kubernetes:
    name: Deploy to Kubernetes (Minikube)
    runs-on: ubuntu-latest
    needs: build-docker
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Minikube
      uses: medyagh/setup-minikube@latest
      with:
        minikube-version: 'latest'
        driver: docker
        cpus: 2
        memory: 4096

    - name: Start Minikube
      run: minikube start --driver=docker

    - name: Build Docker Images in Minikube
      run: |
        eval $(minikube docker-env)
        docker build -t crypto-api:latest ./api
        docker build -t crypto-frontend:latest ./cryptoFront
        docker build -t crypto-collector:latest ./collector

    - name: Configure Local Domains
      run: |
        MINIKUBE_IP=$(minikube ip)
        echo "$MINIKUBE_IP crypto-platform.local" | sudo tee -a /etc/hosts
        echo "$MINIKUBE_IP www.crypto-platform.local" | sudo tee -a /etc/hosts
        echo "$MINIKUBE_IP api.crypto-platform.local" | sudo tee -a /etc/hosts
        echo "$MINIKUBE_IP grafana.crypto-platform.local" | sudo tee -a /etc/hosts
        echo "$MINIKUBE_IP prometheus.crypto-platform.local" | sudo tee -a /etc/hosts
        cat /etc/hosts

    - name: Deploy to Kubernetes
      run: kubectl apply -f k8s/

    - name: Wait for Core Services
      run: |
        kubectl wait --for=condition=ready pod -l app=postgres -n crypto-platform --timeout=300s
        kubectl wait --for=condition=ready pod -l app=api -n crypto-platform --timeout=300s
        kubectl wait --for=condition=ready pod -l app=collector -n crypto-platform --timeout=300s
        kubectl wait --for=condition=ready pod -l app=frontend -n crypto-platform --timeout=300s

    - name: Verify Deployment
      run: kubectl get all -n crypto-platform

    - name: Deployment Summary
      run: |
        echo "## Kubernetes Deployment" >> $GITHUB_STEP_SUMMARY
        echo "Version: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Access URLs:" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend: http://crypto-platform.local" >> $GITHUB_STEP_SUMMARY
        echo "- API: http://api.crypto-platform.local" >> $GITHUB_STEP_SUMMARY
        echo "- Grafana: http://grafana.crypto-platform.local" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        kubectl get pods -n crypto-platform >> $GITHUB_STEP_SUMMARY

