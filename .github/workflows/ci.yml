name: CI - Tests et Sécurité

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: crypto_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'api/package-lock.json'

    - name: Install Dependencies
      working-directory: ./api
      run: npm ci

    - name: Setup Database
      working-directory: ./api
      run: |
        echo "Setting up test database..."
        sleep 5
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword

    - name: Run Unit Tests
      working-directory: ./api
      run: npm test
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword
        JWT_SECRET: test-secret-key

    - name: Run Integration Tests
      working-directory: ./api
      run: npm run test:integration
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword
        JWT_SECRET: test-secret-key
        RABBITMQ_URL: amqp://guest:guest@localhost:5672

    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: api/coverage/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'api/package-lock.json'

    - name: Install Dependencies
      working-directory: ./api
      run: npm ci

    - name: NPM Audit
      working-directory: ./api
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Snyk Security Test
      working-directory: ./api
      run: |
        npm install -g snyk
        snyk auth ${{ secrets.SNYK_TOKEN }}
        snyk test --severity-threshold=medium
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

    - name: Snyk Code Test
      working-directory: ./api
      run: snyk code test --severity-threshold=high
      continue-on-error: true

    - name: Generate Security Report
      working-directory: ./api
      run: npm run security:report
      continue-on-error: true

    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: api/reports/security/

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'cryptoFront/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./cryptoFront
      run: npm ci

    - name: Build Frontend
      working-directory: ./cryptoFront
      run: npm run build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: cryptoFront/dist/

  collector-test:
    name: Collector Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'collector/package-lock.json'

    - name: Install Collector Dependencies
      working-directory: ./collector
      run: npm ci

    - name: Test Collector
      working-directory: ./collector
      run: |
        echo "Testing collector service..."
        node -c src/index.js
        echo "Collector syntax check passed"