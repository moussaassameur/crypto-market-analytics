name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-test:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install API Dependencies
      working-directory: ./api
      run: npm ci

    - name: Install Frontend Dependencies  
      working-directory: ./cryptoFront
      run: npm ci

    - name: Install Collector Dependencies
      working-directory: ./collector
      run: npm ci

    - name: Lint API Code
      working-directory: ./api
      run: npm run lint || echo "Linting completed with warnings"

    - name: API Unit Tests
      working-directory: ./api
      run: npm test

    - name: Frontend Build Test
      working-directory: ./cryptoFront
      run: npm run build

    - name: Collector Syntax Check
      working-directory: ./collector
      run: node -c src/index.js

    - name: Security Quick Scan
      working-directory: ./api
      run: npm audit --audit-level=high
      continue-on-error: true

  changes-detection:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      frontend: ${{ steps.changes.outputs.frontend }}
      collector: ${{ steps.changes.outputs.collector }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Detect Changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          api:
            - 'api/**'
          frontend:
            - 'cryptoFront/**'
          collector:
            - 'collector/**'

  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: changes-detection
    if: needs.changes-detection.outputs.api == 'true'

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: crypto_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'api/package-lock.json'

    - name: Install Dependencies
      working-directory: ./api
      run: npm ci

    - name: Run Integration Tests
      working-directory: ./api
      run: npm run test:integration
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: crypto_test
        DB_USER: postgres
        DB_PASSWORD: testpassword
        JWT_SECRET: test-secret-key

  comment-pr:
    name: Comment PR Results
    runs-on: ubuntu-latest
    needs: [quick-test, api-tests]
    if: always()

    steps:
    - name: Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const { context } = github;
          
          let comment = "## PR Validation Results\n\n";
          
          if ("${{ needs.quick-test.result }}" === "success") {
            comment += "✅ Quick validation: PASSED\n";
          } else {
            comment += "❌ Quick validation: FAILED\n";
          }
          
          if ("${{ needs.api-tests.result }}" === "success") {
            comment += "✅ API integration tests: PASSED\n";
          } else if ("${{ needs.api-tests.result }}" === "skipped") {
            comment += "⏭️ API integration tests: SKIPPED (no API changes)\n";
          } else {
            comment += "❌ API integration tests: FAILED\n";
          }
          
          comment += "\nReady for review! 🚀";
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });